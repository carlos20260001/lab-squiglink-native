# The program core: the measurement data, the DSP, the audio, and the rules
# that turn one into another.
#
# It knows nothing about how any of it is drawn. Nothing here depends on
# egui, on eframe, or on any other interface toolkit, so the interface can be
# rewritten — or replaced — without touching the rules of the program, and the
# rules can be tested without a window.
[package]
name = "squiglab-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
once_cell = "1.19"
dirs = "7"
toml = "0.8"

# Audio output. Linux speaks to the PipeWire daemon directly, so building on
# Linux needs the PipeWire development files (libpipewire-0.3-dev and
# libspa-0.2-dev, or equivalent) and libclang, because the bindings are
# generated from PipeWire's headers at build time. macOS and Windows use cpal,
# which needs neither.
[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10", features = ["v0_3_65"] }
libspa-sys = "0.10"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = "0.15"
