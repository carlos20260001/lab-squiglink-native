[package]
name = "squiglab-legacy"
version = "0.1.0"
edition = "2021"
default-run = "squiglab"

[lib]
name = "squiglab_legacy"
path = "src/lib.rs"

[dependencies]
# The program core: the measurements, the filter maths, the audio, and the
# rules that turn one into another. It does not know about the interface, so
# the interface can be rewritten without touching it.
squiglab-core = { path = "../squiglab-core" }
eframe = "0.36"
egui = "0.36"
egui_extras = "0.36"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
once_cell = "1.19"
rgb = "0.8"
dirs = "7"
toml = "0.8"
png = "0.18"
resvg = "0.48"

[[bin]]
name = "app-bundle"
path = "tools/app_bundle.rs"

[[bin]]
name = "squiglab"
path = "src/main.rs"

[build-dependencies]
# The product's mark and its manifest, so the executable can carry them.
squiglab-core = { path = "../squiglab-core" }
winresource = "0.1"
