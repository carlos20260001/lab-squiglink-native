# The interface: the window, the panels, and the widgets they are drawn with.
#
# It draws the program, and knows nothing about how it works: the rules, the
# state and the data live in squiglab-core, which has no egui in it at all.
[package]
name = "squiglab"
version = "0.1.0"
edition = "2021"
default-run = "squiglab"

[lib]
name = "squiglab"
path = "src/lib.rs"

[[bin]]
name = "squiglab"
path = "src/main.rs"

[dependencies]
squiglab-core = { path = "../squiglab-core" }
eframe = "0.36"
egui = "0.36"
egui_extras = "0.36"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "7"

[build-dependencies]
# The product's mark and its manifest, so the executable can carry them.
squiglab-core = { path = "../squiglab-core" }
winresource = "0.1"
