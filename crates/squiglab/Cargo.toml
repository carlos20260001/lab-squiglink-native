# The interface.
#
# It draws the program and knows nothing about how the program works: the
# rules, the state and the data live in squiglab-core, which has no egui in
# it at all.
[package]
name = "squiglab"
version = "0.1.0"
edition = "2021"
default-run = "squiglab"

[lib]
name = "squiglab"
path = "src/lib.rs"

[[bin]]
name = "squiglab"
path = "src/main.rs"

# The packaging tool: it gathers the data, the licence and the mark around
# the executable.
[[bin]]
name = "app-bundle"
path = "tools/app_bundle.rs"

[dependencies]
squiglab-core = { path = "../squiglab-core" }
eframe = "0.36"
egui = "0.36"
egui_extras = { version = "0.36", features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
anyhow = "1.0"
dirs = "7"
# The music player searches the Apple Music catalogue, which is the iTunes
# search service: it needs no key and serves a short preview of every track.
ureq = { version = "3", features = ["json"] }
serde_json = "1.0"

# The file picker. The desktop and the browser have one between them, and
# the phone has its own, which is written here against the platform's own
# libraries rather than taken from a third party.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows", target_arch = "wasm32"))'.dependencies]
rfd = "0.17.2"

# The phone's own picker. The versions are the ones the window already
# uses, so that there is one of each in the tree.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { version = "0.5.2", features = ["relax-sign-encoding"] }
objc2-foundation = { version = "0.2.2", features = [
    "NSArray",
    "NSString",
    "NSURL",
    "NSObject",
    "NSEnumerator",
    "block2",
] }
objc2-ui-kit = { version = "0.2.2", features = [
    "UIApplication",
    "UIDocumentPickerViewController",
    "UIResponder",
    "UIView",
    "UIViewController",
    "UIWindow",
    "objc2-uniform-type-identifiers",
] }

[build-dependencies]
squiglab-core = { path = "../squiglab-core" }
winresource = "0.1"
