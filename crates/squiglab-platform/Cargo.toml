# squiglab-platform — shared compatibility glue between GPUI and the
# underlying cross-platform runtime.
#
# Architecture:
#
#   GPUI 0.2.2
#       |
#       v
#   squiglab-platform  (this crate)
#       |
#       v
#     Winit  (windowing, event loop, input)
#       |
#   +---+---+---+
#   |   |   | |
# Lin Win Mac Wasm
#
# egui-winit is used only for permitted platform integration — never for
# egui widgets, layout, or rendering. wgpu provides the shared GPU renderer.
#
# Feature flags:
#   default   = desktop native (winit, wgpu)
#   web       = wasm32 via Winit's wasm backend + web-sys/wasm-bindgen
#   winit     = explicit winit backend (same as default on desktop)
#
[package]
name = "squiglab-platform"
version = "0.1.0"
edition = "2021"
description = "Shared platform abstraction for GPUI across native and WebAssembly"

[lib]
name = "squiglab_platform"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["winit", "renderer"]
web = [
    "dep:web-sys",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
]
winit = ["dep:winit"]
renderer = ["dep:wgpu"]
egui-winit-integration = ["dep:egui-winit"]
ios = ["dep:objc2", "dep:objc2-foundation"]
android = ["dep:jni", "dep:ndk", "dep:ndk-context"]

[dependencies]
squiglab-core = { path = "../squiglab-core" }

# Window handle abstraction, available on every platform.
raw-window-handle = "0.6"

# Logging.
log = "0.4"

# ---------------------------------------------------------------------------
# Winit — authoritative windowing system (all targets).
# ---------------------------------------------------------------------------
[dependencies.winit]
version = "0.30"
optional = true

# ---------------------------------------------------------------------------
# egui-winit — permitted platform integration only.
# Never exposes egui widgets/layout/rendering to GPUI or application code.
# ---------------------------------------------------------------------------
[dependencies.egui-winit]
version = "0.29"
optional = true
default-features = false

# ---------------------------------------------------------------------------
# wgpu — shared cross-platform GPU renderer.
# ---------------------------------------------------------------------------
[dependencies.wgpu]
version = "=22.1.0"
optional = true
default-features = false

# ---------------------------------------------------------------------------
# wasm-bindgen / web-sys — WebAssembly target only.
# ---------------------------------------------------------------------------
[dependencies.web-sys]
version = "0.3"
optional = true
features = [
    "Document",
    "Window",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "EventTarget",
    "Node",
    "DomRect",
    "KeyboardEvent",
    "MouseEvent",
    "PointerEvent",
    "TouchEvent",
    "WheelEvent",
    "FocusEvent",
    "UiEvent",
    "console",
    "AddEventListenerOptions",
]

[dependencies.js-sys]
version = "0.3"
optional = true

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[dependencies.wasm-bindgen-futures]
version = "0.4"
optional = true

# ---------------------------------------------------------------------------
# Optional platform backends (iOS, Android) — retained for future targets.
# ---------------------------------------------------------------------------
[dependencies.objc2]
version = "0.6"
optional = true

[dependencies.objc2-foundation]
version = "0.3"
optional = true

[dependencies.jni]
version = "0.21"
optional = true

[dependencies.ndk]
version = "0.8"
optional = true

[dependencies.ndk-context]
version = "0.1"
optional = true