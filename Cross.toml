# Cross builds run inside a container, so the apt packages installed on the
# runner are not visible there. Each cross target installs the PipeWire
# development files for its own architecture — the headers bindgen parses and
# the libraries the linker resolves — plus clang and libclang, which bindgen
# uses on the container's native architecture. pkg-config is already in the
# image; it is named here so the list below stays self-explanatory.

[target.i686-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes --no-install-recommends libpipewire-0.3-dev:$CROSS_DEB_ARCH libspa-0.2-dev:$CROSS_DEB_ARCH clang libclang-dev pkg-config",
]

[target.armv7-unknown-linux-gnueabihf]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes --no-install-recommends libpipewire-0.3-dev:$CROSS_DEB_ARCH libspa-0.2-dev:$CROSS_DEB_ARCH clang libclang-dev pkg-config",
]

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes --no-install-recommends libpipewire-0.3-dev:$CROSS_DEB_ARCH libspa-0.2-dev:$CROSS_DEB_ARCH clang libclang-dev pkg-config",
]
