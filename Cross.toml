# Cross builds run inside a container, so the apt packages installed on the
# runner are not visible there.
#
# The 32-bit x86 build uses a Debian image of its own (docker/Dockerfile.i686):
# cross's version-tagged images are Ubuntu 16.04, which has no PipeWire, and
# Debian keeps i386 as a release architecture, so it can supply the headers,
# libraries and cross toolchain an i686 build needs.
#
# The 64-bit targets use cross's current images, which are Ubuntu 24.04: they
# carry the 1.0 PipeWire headers the bindings are generated from, and they
# already point pkg-config at each target's own pkgconfig directory and allow
# it to cross. What is left is the PipeWire development files for the target's
# own architecture — the headers bindgen parses and the libraries the linker
# resolves — which the pre-build hooks install. clang and libclang come from
# the image; they are named again so each list below stands on its own.
#
# The images are named in full rather than as `":main"`, which is a later
# cross's shorthand for the same thing: the version installed here would pass
# the tag on to docker as a whole image reference, and `FROM :main` is not one.

[target.i686-unknown-linux-gnu]
dockerfile = "docker/Dockerfile.i686"

[target.armv7-unknown-linux-gnueabihf]
image = "ghcr.io/cross-rs/armv7-unknown-linux-gnueabihf:main"
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes --no-install-recommends libpipewire-0.3-dev:$CROSS_DEB_ARCH libspa-0.2-dev:$CROSS_DEB_ARCH clang libclang-dev pkg-config",
]

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes --no-install-recommends libpipewire-0.3-dev:$CROSS_DEB_ARCH libspa-0.2-dev:$CROSS_DEB_ARCH clang libclang-dev pkg-config",
]