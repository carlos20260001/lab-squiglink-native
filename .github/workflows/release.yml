name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to create or update (for example, v1.0.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  create-draft:
    name: Prepare draft release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "Release tag must start with v and contain only version characters: $RELEASE_TAG" >&2
            exit 1
          fi
        shell: bash

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        timeout-minutes: 10
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          overwrite_files: true

  linux:
    name: Build Linux ${{ matrix.arch }}
    needs: create-draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
          - target: i686-unknown-linux-gnu
            arch: x86
          - target: armv7-unknown-linux-gnueabihf
            arch: armhf
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tool
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: cargo install cross --locked
        shell: bash

      - name: Build release
        run: ./build.sh "${{ matrix.target }}"
        shell: bash

      - name: Package Linux release
        run: |
          set -eu
          mkdir -p dist
          tar -czf "dist/cringraph-linux-${{ matrix.arch }}.tar.gz" -C dist/linux CrinGraph
        shell: bash

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: cringraph-linux-${{ matrix.arch }}
          path: dist/cringraph-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Build Windows ${{ matrix.arch }}
    needs: create-draft
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-pc-windows-msvc
            arch: x86
            runner: windows-latest
          - target: x86_64-pc-windows-msvc
            arch: x86_64
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            arch: arm64
            runner: windows-11-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Windows release
        run: .\build.cmd ${{ matrix.target }}
        shell: pwsh

      - name: Package Windows release
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path dist/windows/CrinGraph -DestinationPath "dist/cringraph-windows-${{ matrix.arch }}.zip" -Force
        shell: pwsh

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: cringraph-windows-${{ matrix.arch }}
          path: dist/cringraph-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 1

  macos:
    name: Build macOS ${{ matrix.arch }}
    needs: create-draft
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and bundle macOS app
        run: ./build.sh "${{ matrix.target }}"

      - name: Archive macOS app
        run: ditto -c -k --sequesterRsrc --keepParent dist/macos/CrinGraph-native.app "dist/cringraph-macos-${{ matrix.arch }}.zip"

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: cringraph-macos-${{ matrix.arch }}
          path: dist/cringraph-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish all architecture bundles
    needs:
      - create-draft
      - linux
      - windows
      - macos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download release bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release with all bundles
        uses: softprops/action-gh-release@v2
        timeout-minutes: 15
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/cringraph-linux-*.tar.gz
            release-assets/cringraph-windows-*.zip
            release-assets/cringraph-macos-*.zip
