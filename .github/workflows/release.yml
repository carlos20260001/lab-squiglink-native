name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Build and stage Linux release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux release
        run: ./build.sh
        shell: bash

      - name: Package Linux release
        run: |
          set -eu
          mkdir -p staging/CrinGraph dist
          cp target/release/crigraph-native staging/CrinGraph/
          cp -a data data_hp config-examples README.md LICENSE staging/CrinGraph/
          tar -czf dist/cringraph-linux-x86_64.tar.gz -C staging CrinGraph
        shell: bash

      - name: Create draft release with Linux bundle
        uses: softprops/action-gh-release@v2
        timeout-minutes: 15
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: dist/cringraph-linux-x86_64.tar.gz

  windows:
    name: Build Windows release and publish
    runs-on: windows-latest
    needs: linux
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows release
        run: .\build.cmd
        shell: pwsh

      - name: Package Windows release
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force staging/CrinGraph, dist | Out-Null
          Copy-Item target/release/crigraph-native.exe staging/CrinGraph/
          Copy-Item data, data_hp, config-examples, README.md, LICENSE staging/CrinGraph/ -Recurse
          Compress-Archive -Path staging/CrinGraph -DestinationPath dist/cringraph-windows-x86_64.zip -Force
        shell: pwsh

      - name: Upload Windows bundle and publish release
        uses: softprops/action-gh-release@v2
        timeout-minutes: 15
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: dist/cringraph-windows-x86_64.zip
