[package]
name = "squiglab"
version = "0.1.0"
edition = "2021"
default-run = "squiglab"

[dependencies]
eframe = "0.36"
egui = "0.36"
egui_extras = "0.36"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
once_cell = "1.19"
rgb = "0.8"
dirs = "7"
toml = "0.8"
png = "0.18"
resvg = "0.48"

# Audio output. Linux speaks to the PipeWire daemon directly, so building on
# Linux needs the PipeWire development files (libpipewire-0.3-dev and
# libspa-0.2-dev, or equivalent) and libclang, because the bindings are
# generated from PipeWire's headers at build time. macOS and Windows use cpal,
# which needs neither.
[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10", features = ["v0_3_65"] }
libspa-sys = "0.10"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = "0.15"

[[bin]]
name = "app-bundle"
path = "tools/app_bundle.rs"

[build-dependencies]
png = "0.18"
resvg = "0.48"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
winresource = "0.1"
