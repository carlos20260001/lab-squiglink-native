[workspace]
members = [
    "crates/d3",
    "crates/squiglab-core",
    "crates/squiglab-gpui",
    "crates/svg-tessellate",
    "crates/app-bundle",
    "crates/squiglab-platform",
    "crates/gpui",
    "crates/gpui_util",
]
resolver = "2"

[patch.crates-io]
gpui = { path = "crates/gpui" }
gpui_util = { path = "crates/gpui_util" }

# The program's core rules live in squiglab-core and know nothing about how
# anything is drawn. The active native frontend being ported to 1:1 parity with
# the web reference is `squiglab-gpui`.
