[workspace]
members = ["crates/squiglab-core", "crates/squiglab-legacy"]
resolver = "2"

# The program's own crate, and the interface that draws it, are members of
# this workspace. The application itself is the legacy interface, kept whole so
# that a new one can be written beside it; the rules of the program live in
# squiglab-core and know nothing about how anything is drawn.
