[package]
name = "crigraph-native"
version = "0.1.0"
edition = "2021"
default-run = "crigraph-native"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui_extras = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
once_cell = "1.19"
rgb = "0.8"
dirs = "7"
toml = "0.8"
png = "0.18"
resvg = "0.48"

[[bin]]
name = "app-bundle"
path = "tools/app_bundle.rs"

[build-dependencies]
png = "0.18"
resvg = "0.48"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
winresource = "0.1"
